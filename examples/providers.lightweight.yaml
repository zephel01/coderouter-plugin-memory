# 軽量構成 — RAM が少ないマシン or 試運転用。
#
# シナリオ:
#   - 1 モデルのみ (qwen2.5-coder:7b、4.7 GB)
#   - memory backend は builtin sqlite3 (agentmemory プロセス不要)
#   - 起動から 30 秒で動作確認できる最小セット
#
# 期待 RAM 消費:
#   - Ollama (qwen2.5-coder:7b 推論): ~6-8 GB
#   - CodeRouter (Python): ~50-100 MB
#   - 合計 ~8 GB あれば回せる

providers:
  - name: ollama-coder
    kind: anthropic
    base_url: http://localhost:11434
    model: qwen2.5-coder:7b

profiles:
  - name: default
    providers: [ollama-coder]

plugins:
  enabled:
    - memory
  config:
    memory:
      backend: builtin
      # store: ~/.coderouter/memory.sqlite3   # default、project root で OK
      inject_token_budget: 1500              # 軽め
