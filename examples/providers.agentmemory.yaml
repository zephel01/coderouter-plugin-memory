# agentmemory backend — DEFERRED to v0.5.
#
# The external agentmemory / mem0 / null backends and their keys
# (`backend:`, `endpoint:`, `secret_env:`, `circuit_breaker_*`, `search_limit:`)
# were removed in v0.4.0. Passing any of them now is ignored with a warning
# (see MemoryPlugin.__init__), so this file no longer wires agentmemory.
#
# It is kept as a placeholder for when a networked backend returns in v0.5. In
# the meantime it uses the same v0.4.0 JSONL memory as providers.builtin.yaml,
# so it still works if you copy it.

providers:
  - name: ollama-local
    kind: anthropic
    base_url: http://localhost:11434
    model: qwen3.6:35b-a3b-q4_K_M    # Ollama に pull 済みのモデル名と一致させる

profiles:
  - name: default
    providers: [ollama-local]

plugins:
  enabled:
    - memory
  config:
    memory:
      consolidate_model: qwen3:1.7b
      ollama_base_url: http://localhost:11434
      inject_token_budget: 2000
      min_buffer_entries: 3
      max_inject_facts: 10
