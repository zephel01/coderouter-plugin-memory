# Minimal config — v0.4.0 builtin JSONL memory.
#
# NOTE (v0.4.0): the pre-0.4 backend selector (`backend: builtin|agentmemory|
# mem0|null`) and the sqlite3 store were removed. Memory is now a single,
# dependency-free JSONL store under ~/.coderouter/memory/<project>/ with three
# phases: capture (Observer) → consolidate (Ollama CLI) → inject (InputFilter).
# This file shows the default, zero-extra-services setup.
#
# What this gives you:
#   - buffer.jsonl / facts.jsonl / manual.md per project (auto-created)
#   - offline, no extra process, no native deps
#   - fact extraction via a small local Ollama model on
#     `coderouter-memory consolidate` (run manually or from cron)

providers:
  - name: ollama-local
    kind: anthropic
    base_url: http://localhost:11434
    model: qwen3.6:35b-a3b-q4_K_M    # Ollama に pull 済みのモデル名と一致させる

profiles:
  - name: default
    providers: [ollama-local]

plugins:
  enabled:
    - memory   # entry-point name, NOT the package name
  config:
    memory:
      # project 省略時は cwd / 環境変数から自動検出
      consolidate_model: qwen3:1.7b          # consolidate に使う軽量 Ollama モデル
      ollama_base_url: http://localhost:11434
      inject_token_budget: 2000              # system prompt 注入の上限 (chars/4)
      min_buffer_entries: 3                  # consolidate 発火の最小 buffer 件数
      max_inject_facts: 10
      # state_dir: ~/.coderouter/memory       # 保存先ルートの上書き (任意)
