# Disable memory explicitly — useful in CI / production-staging
# environments where you want the plugin loaded (so it shows up in
# `coderouter doctor` etc.) but no actual memory persistence.
#
# NOTE (v0.4.0): the `backend: null` selector was removed. The equivalent now
# is to turn off both phases with `capture_enabled: false` and
# `inject_enabled: false` — the plugin still loads (visible as
# "memory-plugin-loaded") but does zero disk writes and injects nothing.
#
# When to pick this over deleting `plugins.enabled: [memory]`:
#   - You manage one providers.yaml across multiple environments and
#     want a single boolean-ish toggle.
#   - You're debugging routing and want to rule out memory injection
#     as a contributing factor without rewiring config.

providers:
  - name: ollama-local
    kind: anthropic
    base_url: http://localhost:11434
    model: qwen3.6:35b-a3b-q4_K_M    # Ollama に pull 済みのモデル名と一致させる

profiles:
  - name: default
    providers: [ollama-local]

plugins:
  enabled:
    - memory
  config:
    memory:
      capture_enabled: false   # Observer フェーズを無効化 (buffer に書かない)
      inject_enabled: false    # InputFilter フェーズを無効化 (facts を注入しない)
